[project]
name = "finexpert"
version = "0.1.0"
description = "Fine-tuning Qwen3-4B (QLoRA) for grounded financial analysis, with audited real-report data (FinQA, TAT-QA) and deterministic evaluation"
readme = "README.md"
authors = [
    { name = "mani1234765", email = "manideepdasanapu2003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas>=2.2",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
